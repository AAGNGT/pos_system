<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客戶顯示屏 - ASSTUDIOHK</title>
  <link rel="icon" href="images.png" type="image/png">
  <link rel="stylesheet" href="css/display.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <div class="cdisp">
    <header class="cdisp__header">
      <img class="cdisp__logo" src="images.png" alt="POS">
      <h1 class="cdisp__store" id="storeName">POS 商店</h1>
      <span class="cdisp__status" id="displayStatus">連線中…</span>
    </header>

    <div class="cdisp__views">
      <section class="cdisp-view cdisp-idle active" data-view="idle">
        <div class="cdisp-idle">
          <img src="images.png" alt="" width="120" height="120" style="opacity:0.9">
          <h2 class="cdisp-idle__title">歡迎光臨</h2>
          <p class="cdisp-idle__sub">請稍候店員為您服務</p>
        </div>
      </section>

      <section class="cdisp-view cdisp-cart" data-view="cart">
        <div class="cdisp-cart__list" id="cartList"></div>
        <footer class="cdisp-cart__footer">
          <p class="cdisp-cart__total-label">合計應付</p>
          <p class="cdisp-cart__total" id="cartTotal">$0</p>
        </footer>
      </section>

      <section class="cdisp-view cdisp-checkout" data-view="checkout">
        <div class="cdisp-checkout">
          <p class="cdisp-checkout__label">請支付</p>
          <p class="cdisp-checkout__amount" id="checkoutAmount">$0</p>
        </div>
      </section>

      <section class="cdisp-view cdisp-thankyou" data-view="thankyou">
        <div class="cdisp-thankyou">
          <h2 class="cdisp-thankyou__title">多謝惠顧</h2>
          <p class="cdisp-thankyou__row">應付：<strong id="thankTotal">$0</strong></p>
          <p class="cdisp-thankyou__row">實收：<strong id="thankReceived">$0</strong></p>
          <p class="cdisp-thankyou__row">找續：<strong id="thankChange">$0</strong></p>
        </div>
      </section>
    </div>
  </div>

  <div class="cdisp__error" id="displayError"></div>

  <script src="js/supabase-client.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
