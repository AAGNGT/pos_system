<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客戶顯示屏 - HKRSS</title>
  <link rel="icon" href="images.png" type="image/png">
  <link rel="stylesheet" href="css/display.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <div class="cdisp">
    <header class="cdisp__header">
      <img class="cdisp__logo" src="images.png" alt="POS">
      <h1 class="cdisp__store" id="storeName">POS 商店</h1>
      <span class="cdisp__status" id="displayStatus">連線中…</span>
    </header>

    <div class="cdisp__views">
      <section class="cdisp-view cdisp-idle active" data-view="idle">
        <div class="cdisp-idle">
          <img src="images.png" alt="" width="120" height="120" style="opacity:0.9">
          <h2 class="cdisp-idle__title">歡迎光臨</h2>
          <p class="cdisp-idle__sub">請稍候店員為您服務</p>
        </div>
      </section>

      <section class="cdisp-view cdisp-cart" data-view="cart">
        <div class="cdisp-cart__list" id="cartList"></div>
        <footer class="cdisp-cart__footer">
          <div class="cdisp-cart__footer-row cdisp-cart__footer-row--single" id="cartFooterRow">
            <div class="cdisp-cart__discount-wrap hidden" id="cartDiscountWrap">
              <p class="cdisp-cart__total-label">折扣金額</p>
              <p class="cdisp-cart__amount cdisp-cart__discount" id="cartDiscount">-$0</p>
            </div>
            <div class="cdisp-cart__total-wrap">
              <p class="cdisp-cart__total-label">合計應付</p>
              <p class="cdisp-cart__amount cdisp-cart__total" id="cartTotal">$0</p>
            </div>
          </div>
        </footer>
      </section>

      <section class="cdisp-view cdisp-checkout" data-view="checkout">
        <!-- 補上 Flexbox 確保 Loading 和文字完美垂直對齊 -->
        <div class="cdisp-checkout" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;">
          
          <div class="loader"></div> <!-- 改用 div 也可以，或者保留 span -->
          
          <p class="cdisp-checkout__label">請付款</p>
          <p class="cdisp-checkout__amount" id="checkoutAmount">$0</p>
        </div>
      </section>


      <section class="cdisp-view cdisp-thankyou" data-view="thankyou">
        <div class="cdisp-thankyou__inner">
          <!-- 左側：原有感謝文字 -->
          <div class="cdisp-thankyou__left">
            <h2 class="cdisp-thankyou__title">多謝惠顧</h2>
            <p class="cdisp-thankyou__row">總計: <strong id="thankTotal">$0</strong></p>
            <p class="cdisp-thankyou__row">實收: <strong id="thankReceived">$0</strong></p>
            <p class="cdisp-thankyou__row">找贖: <strong id="thankChange">$0</strong></p>
          </div>
          <!-- 右側：QR Code 區塊 (預設隱藏，靠動畫滑入) -->
          <div class="cdisp-thankyou__right" id="receiptQrWrap">
            <div class="qr-box">
              <div id="qrcode"></div>
            </div>
            <p class="qr-text">掃描獲取電子收據</p>
            <p class="qr-order" id="displayOrderCode">單號: -</p>
          </div>
        </div>
      </section>

    </div>
  </div>

  <div class="cdisp__errors" id="displayErrors" aria-live="polite"></div>

  <script src="js/supabase-client.js"></script>
  <script src="js/product-thumb.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
