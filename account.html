<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的帳戶 — 卍物所</title>
    <meta name="description" content="卍物所帳戶：管理個人資料、查看市集預訂記錄。">
    <link rel="icon" href="Logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/account.css">
    <link rel="stylesheet" href="css/order-status.css">
</head>
<body>
    <header class="site-header scrolled">
        <div class="header-inner">
            <a href="index.html" class="brand">
                <span class="logo-ring logo-ring--sm" aria-hidden="true">
                    <img src="Logo.jpg" alt="">
                </span>
                <span class="brand-name">卍物所</span>
            </a>
            <button class="nav-toggle" type="button" aria-label="開啟選單">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path d="M4 7h16M4 12h16M4 17h16"/>
                </svg>
            </button>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">首頁</a></li>
                    <li><a href="privacy.html">私隱權政策</a></li>
                    <li><a href="data-security.html">數據安全</a></li>
                    <li><a href="account.html">我的帳戶</a></li>
                    <li><a href="index.html#products">寧磚款式</a></li>
                    <li><a href="index.html#market">市集預訂</a></li>
                </ul>
            </nav>
            <div class="header-auth" id="headerAuth"></div>
        </div>
    </header>

    <script>
        (function() {
            var cachedName = localStorage.getItem('session_username');
            var authContainer = document.getElementById('headerAuth');
            if (authContainer) {
                if (cachedName) {
                    // 防止 XSS 攻擊的字元過濾
                    var safeName = cachedName.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    authContainer.innerHTML = '<a href="account.html" class="header-auth-link">' + safeName + '</a>';
                } else {
                    authContainer.innerHTML = '<button type="button" class="header-auth-btn" id="openAuthBtn">登入</button>';
                }
            }
        })();
    </script>

    <main class="account-page">
        <div class="section-inner">
            <p class="section-label">Account</p>
            <h1 class="section-title">我的帳戶</h1>
            <p class="section-lead">管理個人資料，查閱與您電郵相符的市集預訂。</p>
            <div id="accountContent">
                <p class="loading-placeholder">載入中…</p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p class="footer-brand">卍物所 · 香磚 • 寧磚 · 萬物皆可能</p>
        <nav class="footer-legal" aria-label="法律文件">
            <a href="privacy.html">私隱權政策</a>
            <span aria-hidden="true">·</span>
            <a href="data-security.html">數據安全聲明</a>
            <span aria-hidden="true">·</span>
            <a href="account.html">我的帳戶</a>
        </nav>
        <p class="footer-copy">© 2026 卍物所 · 最後更新：2026-07-12</p>
    </footer>

    <!-- Auth modal (shared) -->
    <div class="modal-overlay auth-modal" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
        <div class="modal-sheet auth-sheet">
            <button type="button" class="modal-close" id="authModalClose" aria-label="關閉">×</button>
            <h2 id="authModalTitle" class="auth-modal-title">帳戶</h2>

            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab active" data-tab="login" role="tab" aria-selected="true">登入</button>
                <button type="button" class="auth-tab" data-tab="register" role="tab" aria-selected="false">註冊</button>
            </div>

            <button type="button" class="auth-google-btn" data-auth-google>
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                使用 Google 帳戶繼續
            </button>

            <p class="auth-divider"><span>或使用電郵</span></p>

            <div id="authLoginPanel">
                <form id="authLoginForm" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="login_email">電郵</label>
                        <input type="email" id="login_email" name="email" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="login_password">密碼</label>
                        <input type="password" id="login_password" name="password" required autocomplete="current-password" minlength="6">
                    </div>
                    <p class="auth-forgot"><a href="#" id="authForgotLink">忘記密碼？</a></p>
                    <button type="submit" class="btn btn-primary" style="width:100%">登入</button>
                </form>
            </div>

            <div id="authRegisterPanel" hidden>
                <form id="authRegisterForm" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="reg_display_name">顯示名稱</label>
                        <input type="text" id="reg_display_name" name="display_name" autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="reg_email">電郵 *</label>
                        <input type="email" id="reg_email" name="email" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="reg_password">密碼 *</label>
                        <input type="password" id="reg_password" name="password" required autocomplete="new-password" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="reg_password_confirm">確認密碼 *</label>
                        <input type="password" id="reg_password_confirm" name="password_confirm" required autocomplete="new-password" minlength="6">
                    </div>
                    <label class="auth-agree">
                        <input type="checkbox" name="agree" required>
                        <span>我已閱讀並同意 <a href="privacy.html" target="_blank">《私隱權政策》</a> 及 <a href="data-security.html" target="_blank">《數據安全聲明》</a></span>
                    </label>
                    <button type="submit" class="btn btn-primary" style="width:100%">註冊</button>
                </form>
            </div>

            <div class="form-feedback" id="authFeedback" role="status"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/account.js"></script>
</body>
</html>
