<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理控制台 — 卍物所</title>
    <link rel="icon" href="Logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* 管理員專屬樣式 */
        .admin-page { padding-top: calc(var(--header-h) + 40px); padding-bottom: 80px; min-height: 80vh; background: var(--bg); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
        .admin-title { font-family: "Noto Serif TC", serif; font-size: 1.5rem; color: #991b1b; display: flex; align-items: center; gap: 10px; }
        
        .admin-table-container { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: auto; box-shadow: var(--shadow-soft); }
        .admin-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
        .admin-table th, .admin-table td { padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .admin-table th { background: #fef2f2; color: #991b1b; font-weight: 600; white-space: nowrap; }
        .admin-table tr:last-child td { border-bottom: none; }
        .admin-table tr:hover { background: #f9fafb; }
        
        .status-select { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.82rem; font-family: inherit; background: var(--bg); outline: none; }
        .btn-update { padding: 6px 12px; font-size: 0.8rem; background: var(--text); color: #fff; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-update:hover { background: #333; }
        
        /* 避免未驗證前閃現內容 */
        #adminApp { display: none; }
    </style>
</head>
<body>
    <header class="site-header scrolled">
        <div class="header-inner">
            <a href="index.html" class="brand">
                <span class="logo-ring logo-ring--sm" aria-hidden="true"><img src="Logo.jpg" alt=""></span>
                <span class="brand-name">卍物所</span>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">返回首頁</a></li>
                    <li><a href="account.html">我的帳戶</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="admin-page" id="adminApp">
        <div class="section-inner" style="max-width: 1200px; margin: 0 auto; padding: 0 24px;">
            <div class="admin-header">
                <h1 class="admin-title">🛡️ 訂單管理控制台</h1>
                <button type="button" class="btn btn-secondary" id="btnRefresh">🔄 重新載入數據</button>
            </div>

            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>訂單 ID</th>
                            <th>客戶姓名</th>
                            <th>聯絡電話</th>
                            <th>產品名稱</th>
                            <th>數量</th>
                            <th>取貨日期</th>
                            <th>目前狀態</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrderList">
                        <tr><td colspan="8" class="loading-placeholder">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="customAlertModal" role="dialog" aria-modal="true">
        <div class="modal-sheet alert-sheet" style="max-width: 400px; text-align: center; padding: 40px 32px;">
            <div style="font-size: 3rem; margin-bottom: 20px; line-height: 1;">🚫</div>
            <h3 style="font-family: 'Noto Serif TC', serif; font-size: 1.35rem; margin-bottom: 12px; color: #991b1b;">存取拒絕</h3>
            <p id="customAlertMessage" style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 32px; line-height: 1.6;"></p>
            <button type="button" id="customAlertBtn" class="btn btn-primary" style="width: 100%;">返回帳戶頁</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const client = typeof getSupabaseClient === 'function' ? getSupabaseClient() : window.supabaseClient;
            if (!client) {
                alert("無法連接資料庫，請檢查設定。");
                return;
            }

            const adminApp = document.getElementById('adminApp');
            const alertModal = document.getElementById('customAlertModal');
            const alertMsg = document.getElementById('customAlertMessage');
            const alertBtn = document.getElementById('customAlertBtn');
            const orderListEl = document.getElementById('adminOrderList');
            const btnRefresh = document.getElementById('btnRefresh');

            // 1. 驗證管理員身份 (防護機制)
            const { data: { session }, error: authError } = await client.auth.getSession();
            if (!session || session.user.email !== 'admin@market.local') {
                alertMsg.textContent = "您沒有權限訪問此頁面，僅限管理員登入。";
                alertModal.style.display = 'flex';
                alertBtn.onclick = () => window.location.href = 'account.html';
                return;
            }

            // 驗證通過，解鎖顯示介面
            adminApp.style.display = 'block';

            // 防止 XSS
            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
            }

            // 2. 載入所有訂單
            async function loadAllOrders() {
                orderListEl.innerHTML = '<tr><td colspan="8" class="loading-placeholder">載入中...</td></tr>';
                
                try {
                    // 讀取主訂單
                    const { data: orders, error } = await client
                        .from('wanwu_orders')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (error) throw error;

                    if (!orders || orders.length === 0) {
                        orderListEl.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 30px;">目前沒有訂單</td></tr>';
                        return;
                    }

                    // 讀取明細 (如有)
                    const { data: itemsData } = await client.from('wanwu_order_items').select('*');
                    const itemsMap = {};
                    if (itemsData) {
                        itemsData.forEach(item => {
                            if (!itemsMap[item.order_id]) itemsMap[item.order_id] = [];
                            itemsMap[item.order_id].push(item);
                        });
                    }

                    // 渲染至表格
                    orderListEl.innerHTML = orders.map(o => {
                        const oItems = itemsMap[o.id] || [];
                        let productsHtml = '';
                        let totalQty = 0;

                        if (oItems.length > 0) {
                            productsHtml = oItems.map(i => `<div>• <strong>${escapeHtml(i.product_name)}</strong> (x${i.quantity})</div>`).join('');
                            totalQty = oItems.reduce((sum, i) => sum + i.quantity, 0);
                        } else {
                            // 適配新架構的 order_summary 
                            productsHtml = `<strong>${escapeHtml(o.order_summary || o.product_name || '多項產品')}</strong>`;
                            totalQty = o.quantity || '-';
                        }

                        // 顯示總金額
                        const totalAmountHtml = o.total_amount != null ? `<br><span style="color:#991b1b; font-size:0.8rem; font-weight:600;">總額: HK$${o.total_amount}</span>` : '';

                        return `
                            <tr>
                                <td>#${o.id}</td>
                                <td>${escapeHtml(o.customer_name)}</td>
                                <td>${escapeHtml(o.customer_phone)}</td>
                                <td style="line-height: 1.5; min-width: 180px;">${productsHtml}${totalAmountHtml}</td>
                                <td><span style="background: #f3f4f6; padding: 4px 8px; border-radius: 4px; font-weight: 600;">${totalQty}</span></td>
                                <td>${escapeHtml(o.pickup_date)}</td>
                                <td>
                                    <select class="status-select" id="status-${o.id}">
                                        <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>待確認</option>
                                        <option value="processing" ${o.status === 'processing' ? 'selected' : ''}>處理中</option>
                                        <option value="ready" ${o.status === 'ready' ? 'selected' : ''}>已完成備貨</option>
                                        <option value="completed" ${o.status === 'completed' ? 'selected' : ''}>已完成交易</option>
                                        <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>已取消</option>
                                    </select>
                                </td>
                                <td>
                                    <button class="btn-update" onclick="window.updateOrderStatus(${o.id}, this)">儲存</button>
                                </td>
                            </tr>
                        `;
                    }).join('');

                } catch (err) {
                    orderListEl.innerHTML = `<tr><td colspan="8" style="color:red; text-align:center;">載入失敗: ${err.message}</td></tr>`;
                }
            }

            // 3. 執行更新狀態功能 (核心修復)
            window.updateOrderStatus = async function(orderId, btnElement) {
                const statusSelect = document.getElementById(`status-${orderId}`);
                const newStatus = statusSelect.value;
                
                const originalText = btnElement.textContent;
                btnElement.textContent = '處理中...';
                btnElement.disabled = true;

                try {
                    const { error } = await client
                        .from('wanwu_orders')
                        .update({ status: newStatus })
                        .eq('id', orderId);

                    if (error) throw error;
                    
                    // 成功反饋
                    btnElement.textContent = '✅ 已儲存';
                    btnElement.style.background = '#059669'; // 轉為綠色
                    
                    setTimeout(() => {
                        btnElement.textContent = originalText;
                        btnElement.style.background = ''; // 恢復原色
                        btnElement.disabled = false;
                    }, 2000);

                } catch (err) {
                    alert('更新失敗: ' + err.message);
                    btnElement.textContent = '❌ 失敗';
                    btnElement.style.background = '#991b1b'; // 轉為紅色
                    setTimeout(() => {
                        btnElement.textContent = originalText;
                        btnElement.style.background = '';
                        btnElement.disabled = false;
                    }, 2000);
                }
            };

            // 綁定手動刷新按鈕
            if (btnRefresh) {
                btnRefresh.addEventListener('click', loadAllOrders);
            }

            // 首次載入執行
            loadAllOrders();
        });
    </script>

</body>
</html>
